name: rollback

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Previously published sha256 digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: validate rollback digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Check out rollback logic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject mutable or malformed references
        id: digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          python3 scripts/validate_image_digest.py "$DIGEST" >/dev/null
          echo "value=$DIGEST" >>"$GITHUB_OUTPUT"

  rollback:
    name: rollback production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out rollback logic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the approved immutable digest
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_DEPLOY_DIR: ${{ secrets.PRODUCTION_DEPLOY_DIR }}
          DIGEST: ${{ needs.validate.outputs.digest }}
        run: scripts/run_remote_deploy.sh "$DIGEST"
